<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyweaver — paused</title>
  <meta name="description" content="Keyweaver is paused. New downloads are unavailable. Existing installs continue to work for now." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://keyweaver.io/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@300;500&family=Cal+Sans&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0a0f;
      --text: #e8e8f0;
      --muted: #8a8aa3;
      --accent: #5b6bf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: "SN Pro", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(91, 107, 248, 0.18), transparent 60%),
        var(--ink);
    }
    main {
      max-width: 34rem;
      text-align: center;
    }
    .brand {
      font-weight: 300;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      letter-spacing: 0.02em;
      margin: 0 0 1rem;
      line-height: 1;
    }
    h1 {
      font-family: "Cal Sans", sans-serif;
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0 0 1rem;
    }
    p {
      margin: 0 0 0.85rem;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .note {
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: #6b6b88;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Keyweaver</p>
    <h1>We’re paused for now</h1>
    <p>New downloads and sign-ups are unavailable while the company is wound down.</p>
    <p>If you already have the plugins installed, they should keep working as usual for a while.</p>
    <p class="note">Questions: <a href="mailto:hello@keyweaver.io">hello@keyweaver.io</a></p>
  </main>
</body>
</html>
